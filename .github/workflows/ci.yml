# Hackathon pipeline. Setup: DEPLOY.md
#   PR into development or main -> check
#   push to main (merge)        -> check, then deploy Render (API) + Vercel (pages)
name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a deploy half-way; superseded PR runs are fine to drop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc, eslint (parallel)
        run: |
          scripts/ci-run-parallel.sh \
            'tsc' 'NODE_OPTIONS=--max-old-space-size=6144 npx tsc --noEmit' \
            'eslint' 'pnpm lint'

  # Own runner: next to tsc + eslint the 5s-timeout UI tests flake from CPU starvation.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  deploy:
    name: Deploy production
    needs: [check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # shortcut: fire-and-forget, Render shows whether its build passed; poll the Render API if that bites.
      - name: Render (API + DB migrations on boot)
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Vercel (pages, /api proxied to Render)
        run: npx --yes vercel@64.7.0 deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
